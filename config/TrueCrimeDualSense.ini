[Controller]
; Stick deadzone in percent (the game adds its own small deadzone on top)
StickDeadzone=12
; How far (percent) a trigger must be pulled to count as a press
TriggerThreshold=30
; 1 = invert camera left/right
InvertCameraX=0
; 1 = invert camera up/down
InvertCameraY=0
; Driving: 0 = original Xbox layout (right stick accelerate/brake, Cross gas, Square brake, R2 fire, L2 get in/out)
;          1 = R2/L2 analog gas/brake, R1 fire, L1 get in/out
TriggersDrive=0
; Set to 1 if cars accelerate when you brake and vice versa
InvertThrottle=0
; Precision-targeting reticule speed at full stick (the game turns value/1024 degrees per frame)
AimSpeed=1024
; 1 = show DualSense button icons in tutorials/help text (needs tools\install.py) instead of PC key names
ButtonPrompts=1
; 1 = forward the game's vibration to the DualSense motors (turn Vibration on in the game's options)
Rumble=1
RumbleStrength=100
; 1 = R2 resistance when a weapon is out
TriggerEffects=1
; Lightbar colour (0-255)
Lightbar=1
LightbarRed=0
LightbarGreen=40
LightbarBlue=255
; 1 = fix the crash when the game re-creates its graphics device (e.g. after a mission)
GraphicsCrashFix=1
; 1 = add "save game" to the pause menu
PauseMenuSave=1
; 1 = scale menus, HUD and text with the screen height (the UI is authored for 640x480)
UIScaleFix=1
; 1 = draw movies at 4:3 with black bars instead of stretching
MovieAspectFix=1
; 1 = scale the in-game HUD (radar, street sign, meters) with the screen height
HUDScaleFix=1
; Size in percent of filling the screen height with the 640x480 layout (100 = height/480; at 1600 lines 90 = 3.0x, 75 = 2.5x)
MenuScale=90
HUDScale=75
; 1 = make the first menu sound follow the SFX volume setting
MenuSoundVolumeFix=1
; 1 = write controller and input values to TrueCrimeDualSense.log
DebugLog=0
