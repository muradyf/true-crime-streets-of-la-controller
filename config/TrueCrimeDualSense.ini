[Controller]
; Stick deadzone in percent (the game adds its own small deadzone on top)
StickDeadzone=12
; How far (percent) a trigger must be pulled to count as a press
TriggerThreshold=30
; 1 = invert camera left/right
InvertCameraX=0
; 1 = invert camera up/down
InvertCameraY=0
; Driving: 0 = original Xbox layout (right stick accelerate/brake, Cross gas, Square brake, R2 fire, L2 get in/out)
;          1 = R2/L2 analog gas/brake, R1 fire, L1 get in/out
TriggersDrive=0
; Set to 1 if cars accelerate when you brake and vice versa
InvertThrottle=0
; Camera / look speed in percent of the right stick's full speed (lower = slower; 10-200)
CameraSpeed=100
; Right-stick response shape, exponent x100: 100 = linear, 200 = v*|v| (default), up to 400. Higher = finer
;     control near the centre with the same speed at full deflection. Prefer raising this over dropping
;     CameraSpeed: the axis is a signed byte, so CameraSpeed 20 leaves only 25 steps and the camera moves in jumps
CameraCurve=200
; Precision-targeting reticule speed at full stick (the game turns value/1024 degrees per frame)
AimSpeed=1024
; 1 = add CAMERA SPEED and AIM SPEED rows to Options > Controls
ControlsMenuRows=1
; 1 = show DualSense button icons in tutorials/help text (needs tools\install.py) instead of PC key names
ButtonPrompts=1
; 1 = forward the game's vibration to the DualSense motors (turn Vibration on in the game's options)
Rumble=1
RumbleStrength=100
; Lightbar colour (0-255)
Lightbar=1
LightbarRed=0
LightbarGreen=40
LightbarBlue=255
; 1 = fix the crash when the game re-creates its graphics device (e.g. after a mission)
GraphicsCrashFix=1
; 1 = add "save game" to the pause menu
PauseMenuSave=1
; 1 = scale menus, HUD and text with the screen height (the UI is authored for 640x480)
UIScaleFix=1
; 1 = draw movies at 4:3 with black bars instead of stretching
MovieAspectFix=1
; Menu background on a screen wider than 4:3, which is the shape the art was drawn in:
;     1 = fit it, keeping its shape, with black bars at the sides
;     2 = fill the screen, keeping its shape, cropping a little off the top and bottom
;     0 = let it stretch to fill, as the game does, which changes its shape
MenuBackgroundAspect=1
; 1 = let horizontally anchored menu items reach the real screen edges instead of the centred 4:3 box, so the
;     menu spreads across a wide screen. The logo and art stay in the 4:3 composition, so they no longer line
;     up with the right-hand items - that alignment is what the default is for
MenuFillWidth=0
; Menu background height as a percent of the screen, when MenuBackgroundAspect=0. The shape the art is meant to
;     be shown at is not recorded anywhere: the texture is stored 1024x512, a 4:3 screen shows it at 4:3, and
;     neither looks right. 94 was found by matching the art against the game's cover by eye, so it is a
;     calibration rather than a derivation. 100 leaves the picture filling the screen as the game draws it
MenuBackgroundHeight=100
; Horizontal UI scale as a percent of the vertical one. The 2D UI was drawn for a 512 pixel wide frame buffer
;     and this port hands it 640, so text and menu art come out a quarter too wide - 80 puts that back, 100
;     leaves the port as it is
UIPixelAspect=100
; 1 = scale the in-game HUD (radar, street sign, meters) with the screen height
HUDScaleFix=1
; 1 = centre the aim reticle's cross on its box and drop the stray pixel at the box corner. The game draws an
;     even-width box with odd-width bars, so the cross sits half a pixel off; scaling the HUD magnifies that
ReticleFix=1
; Aim reticle size as a whole multiple of its 640x480 size: 0 = AUTO (the HUD size rounded to the nearest whole
;     multiple). Whole multiples only - a one-pixel stroke scaled by 2.333 rasterises to 2 pixels on one side of
;     the box and 3 on the other. Also a RETICLE SIZE row in Options > Display
ReticleScale=0
; 1 = draw the box around the aim reticle's cross. 0 = cross only
ReticleBox=1
; Size in percent of filling the screen height with the 640x480 layout (100 = height/480; at 1600 lines 90 = 3.0x, 75 = 2.5x)
MenuScale=90
HUDScale=75
; Cutscene subtitle size as a multiple of the size the game itself draws, x100: 100 = original, 150 = half again,
;     up to 300. 0 = AUTO (follow MenuScale). Also a SUBTITLE SIZE row in Options > Display, which writes the
;     choice back here. Sharing MenuScale's "percent of the screen height" made the smallest step 1.67x at 1600
;     lines, already too big for a line of dialogue
SubtitleScale=0
; 1 = fullscreen at a resolution other than the desktop's runs borderless with black bars
;     (exclusive fullscreen at a non-desktop mode renders black). 2 = borderless at every resolution
BorderlessFullscreen=1
; Exclusive fullscreen: longest wait (ms) for Windows' DWM fullscreen-transition signal when the graphics device is
; created (startup, alt-tab back). Windows waits 3000 and the signal never comes; 500 makes alt-tab ~2.5 s faster.
; 0 can leave the screen black
FullscreenTransitionWait=500
; 1 = after alt-tab, reload the graphics resources without the engine's 5 ms poll and its file thread's 10 ms idle
;     sleep (gameplay: ~4.2 s -> ~1.4 s)
RestorePollFix=1
; 1 = keep the graphics device across alt-tab when Windows has not actually lost it, skipping the rebuild.
;     Only applies to a windowed device (BorderlessFullscreen), where alt-tab then costs nothing at all;
;     exclusive fullscreen always loses the device, so it takes the normal path
KeepDeviceOnAltTab=1
; 1 = Options > Controls > Controller: remap controller buttons per mode (saved to [ControllerMap] below)
ControllerRemapScreen=1
; 1 = Options > Display: list the monitor's resolutions (up to 16), make Apply save the choice, add MENU SIZE / HUD SIZE
DisplayFix=1
; 1 = make the first menu sound follow the SFX volume setting
MenuSoundVolumeFix=1
; 1 = tell Windows the game is DPI aware, so it renders at the screen's real pixels. With this off (or before
;     v1.0.2) a scaled desktop is reported shrunk - 2560x1600 at 150% becomes 1707x1067 - and the game renders
;     small and is stretched back, looking soft and oversized
DpiAware=1
; 1 = log the objective counter's font, transform and position at the moment it is drawn
CounterTrace=0
; 1 = write controller and input values to TrueCrimeDualSense.log
DebugLog=0
